pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Lets Gradle auto-provision a Java 25 toolchain (via the foojay Disco API) for machines
	// that don't already have one installed - the g_mc_monitor jar requires Java 25 to compile.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'g_mc_monitor'
