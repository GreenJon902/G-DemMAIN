plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// jnr-fuse (published as a single shaded jar bundling jnr-ffi/jnr-posix/jnr-constants and the
	// native jffi libraries) backs the FUSE filesystem - it is bundled into our mod jar with
	// `include` so server operators only need to drop one jar in the mods folder.
	implementation "com.github.serceman:jnr-fuse:${project.jnr_fuse_version}:shadow"
	include "com.github.serceman:jnr-fuse:${project.jnr_fuse_version}:shadow"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
