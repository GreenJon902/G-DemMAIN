# Self-contained demo of the sync-static-config.py mechanism - uses fake source trees unrelated
# to any real component. Run with cwd set to this folder (or a scratch copy of it, alongside a
# copy of devUtils/syncDemoFixture/ at the destination paths below), same convention as
# config/prod/sync-map.ini. See doc/Config Sync.md's "Testing" section.
#
# Source folder names (the left side of each entry) are lowercase-only: ConfigParser lowercases
# option names by default, so a mixed-case folder name here would not match the actual folder on
# disk (destination values on the right are left as-is, ConfigParser does not touch those)

[recursive]
recursivesrc = destRecursive

[flat]
flatsrc = destFlat
