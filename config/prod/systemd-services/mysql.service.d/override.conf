[Unit]
# Ensures that g_mc.service is fully stopped before mysql.service begins to stop (and is started before g_mc.service starts)
Before=g_mc.service  

# Status logging
# We need to do it like this as OnFailure cannot run bash
OnFailure=g_service_failed@MariaDB_Database-mysql.service

[Service]
# Get environment variables (we need this to get the github webhook url (for OnFailure))
EnvironmentFile=/etc/g-demmain/common.env

# Status logging
ExecStartPost=/opt/infra/.venv/bin/python3 /opt/infra/scripts/webhooks.py status MariaDB mysql starting
ExecStopPost=/opt/infra/.venv/bin/python3 /opt/infra/scripts/webhooks.py status MariaDB mysql stopped

# Enable monitoring of disk io by other processes (g_monitor)
IOAccounting=yes
