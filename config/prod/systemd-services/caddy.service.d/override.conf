[Unit]
# Status logging
# We need to do it like this as OnFailure cannot run bash
OnFailure=g_service_failed@Caddy-caddy.service

[Service]
# Get environment variables (we need this to get the github webhook url (for OnFailure))
EnvironmentFile=/etc/g-demmain/common.env
EnvironmentFile=/etc/g-demmain/caddy_caddy.env

# Use the repo Caddyfile, not the system default
# ExecStart/ExecReload must be cleared first (setting to empty) - systemd only allows one of each for non-oneshot units
ExecStart=
ExecStart=/usr/bin/caddy run --config /opt/infra/config/prod/g_web/Caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /opt/infra/config/prod/g_web/Caddyfile --force

# Status logging
ExecStartPost=/opt/infra/.venv/bin/python3 /opt/infra/scripts/webhooks.py status Caddy caddy starting
ExecStopPost=/opt/infra/.venv/bin/python3 /opt/infra/scripts/webhooks.py status Caddy caddy stopped

# Enable monitoring of disk io by other processes (g_monitor)
IOAccounting=yes
